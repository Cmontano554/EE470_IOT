<!DOCTYPE html>
<html>
<head>
  <title>ESP8266 LED Controller</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 50px; }
    button { padding: 12px 24px; margin: 10px; font-size: 18px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>ESP8266 Remote LED Controller</h1>
  <button onclick="setLED('ON')">Turn ON</button>
  <button onclick="setLED('OFF')">Turn OFF</button>
  <p id="status"></p>

  <script>
    const fileUrl = "https://cmontanoee.com/results.txt"; 

    async function setLED(state) {
      try {
        const response = await fetch(fileUrl, {
          method: 'PUT',
          headers: { 'Content-Type': 'text/plain' },
          body: state
        });
        if (response.ok) {
          document.getElementById("status").textContent = "LED set to " + state;
        } else {
          document.getElementById("status").textContent = "Server error: " + response.status;
        }
      } catch (err) {
        document.getElementById("status").textContent = "Error sending request.";
      }
    }
  </script>
</body>
</html>
